<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Voiceover pack browser</title>
<style>
  :root { color-scheme: dark; --bg: #16130f; --panel: #221d17; --ink: #e8dcc6; --dim: #9a8b74; --line: #3a3128; --gold: #d9b45b; --warn: #e0a050; --cmp: #8fb3e0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; color: var(--gold); font-weight: 600; }
  header .status { color: var(--dim); font-size: 12px; }
  header .status b { color: var(--ink); font-weight: 500; }
  .notice { margin: 10px 20px 0; padding: 8px 12px; border: 1px solid var(--warn); border-radius: 6px; color: var(--warn); font-size: 13px; }
  .notice code { color: var(--ink); }
  form { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  label.check { flex-direction: row; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); }
  input, select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
  input[type=number] { width: 6em; }
  input.words { width: 16em; }
  button { cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.play { min-width: 5.5em; white-space: nowrap; }
  button.play.cmp { color: var(--cmp); }
  button.play.on { border-color: var(--gold); color: var(--gold); }
  main { padding: 0 20px 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--dim); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.nowrap { white-space: nowrap; }
  tbody tr:hover { background: var(--panel); }
  td.text { max-width: 36em; cursor: pointer; overflow-wrap: anywhere; }
  td.text div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  td.text.open div { display: block; }
  .dim { color: var(--dim); }
  .variant { color: var(--gold); font-size: 12px; }
  .missing { color: var(--warn); font-size: 12px; }
  nav { display: flex; gap: 10px; align-items: center; margin-top: 10px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Forever Voiceover pack browser</h1>
  <span class="status" id="status">Loading the packs…</span>
</header>
<div id="notices"></div>
<form id="filters" autocomplete="off">
  <label>Kind <select name="kind"></select></label>
  <label>Pack <select name="pack"></select></label>
  <label>Voice <select name="voice"></select></label>
  <label>Zone <select name="zone"></select></label>
  <label>Level from <input type="number" name="level_min" min="1" max="70"></label>
  <label>to <input type="number" name="level_max" min="1" max="70"></label>
  <label>Quest <input type="number" name="quest" min="1"></label>
  <label>NPC <input name="npc" placeholder="id or name"></label>
  <label>Words <input class="words" name="q" placeholder="in the text or title"></label>
  <label class="check" id="compare-box" hidden><input type="checkbox" name="compare" value="1"> <span id="compare-label">with a comparison take</span></label>
  <button type="reset">Clear</button>
</form>
<main>
  <nav><button id="prev" type="button">‹ Prev</button><span id="page"></span><button id="next" type="button">Next ›</button></nav>
  <table>
    <thead><tr><th>Kind</th><th>Quest / speaker</th><th>Zone</th><th>Text</th><th>Voice</th><th>Length</th><th>Pack</th><th></th><th id="cmp-head"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
const PAGE = 100;
const form = document.getElementById("filters");
const rowsEl = document.getElementById("rows");
const audio = new Audio();
let facets = null, offset = 0, total = 0, playing = null, queue = [], timer = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const mmss = (d) => d == null ? "" : `${Math.floor(d / 60)}:${String(Math.round(d % 60)).padStart(2, "0")}`;

function fill(select, entries, label) {
  const current = new URLSearchParams(location.search).get(select.name) || "";
  select.innerHTML = `<option value="">Any</option>` + entries.map((e) =>
    `<option value="${esc(e.value)}">${esc(label ? label(e) : e.value)} (${e.count})</option>`).join("");
  select.value = current;
}

function params() {
  const p = new URLSearchParams();
  for (const [k, v] of new FormData(form)) if (String(v).trim()) p.set(k, String(v).trim());
  return p;
}

function restore() {
  const p = new URLSearchParams(location.search);
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === "checkbox") el.checked = p.get(el.name) === "1";
    else if (el.tagName !== "SELECT") el.value = p.get(el.name) || "";
  }
  offset = Math.max(0, parseInt(p.get("offset") || "0", 10) || 0);
}

function stop() {
  audio.pause();
  queue = [];
  if (playing) playing.classList.remove("on");
  playing = null;
}

function play(button, urls) {
  if (playing === button) { stop(); return; }
  stop();
  playing = button;
  button.classList.add("on");
  queue = urls.slice();
  next();
}

function next() {
  const url = queue.shift();
  if (!url) { stop(); return; }
  audio.src = url;
  audio.play().catch(stop);
}
audio.addEventListener("ended", next);
audio.addEventListener("error", stop);

function who(r) {
  if (r.quest_id != null) {
    const speaker = r.speaker_name ? ` <span class="dim">· ${esc(r.speaker_name)}</span>` : "";
    return `${r.quest_id}${r.title ? " · " + esc(r.title) : ""}${speaker}`;
  }
  if (r.kind === "book") return esc(r.title || "Untitled book");
  return `${esc(r.speaker_name || "Unknown")} <span class="dim">(${r.speaker})</span>`;
}

function render(data) {
  total = data.total;
  rowsEl.innerHTML = data.rows.map((r, i) => `<tr>
    <td class="nowrap">${esc(r.kind)}${r.variant ? `<br><span class="variant">${esc(r.variant)}</span>` : ""}</td>
    <td>${who(r)}</td>
    <td class="nowrap">${r.zone ? esc(r.zone) : '<span class="dim">unknown</span>'}${r.level ? ` <span class="dim">· ${r.level}</span>` : ""}</td>
    <td class="text"><div>${r.text ? esc(r.text) : '<span class="dim">text unknown</span>'}</div></td>
    <td>${esc(r.voice || "")}</td>
    <td class="nowrap">${mmss(r.duration)}</td>
    <td class="dim nowrap">${esc(r.pack.replace(/^ForeverVO_Data_/, ""))}</td>
    <td>${r.missing ? '<span class="missing">file missing</span>' : `<button type="button" class="play" data-i="${i}" data-which="pack">▶ theirs</button>`}</td>
    <td>${r.compare_url ? `<button type="button" class="play cmp" data-i="${i}" data-which="cmp">▶ ${esc(facets.compare_label)}</button>` : ""}</td>
  </tr>`).join("") || `<tr><td colspan="9" class="dim">No lines match.</td></tr>`;
  rowsEl.onclick = (e) => {
    const button = e.target.closest("button.play");
    if (button) {
      const r = data.rows[button.dataset.i];
      play(button, button.dataset.which === "cmp" ? [r.compare_url] : r.urls);
      return;
    }
    const cell = e.target.closest("td.text");
    if (cell) cell.classList.toggle("open");
  };
  const last = Math.min(offset + PAGE, total);
  document.getElementById("page").textContent = total ? `${offset + 1}–${last} of ${total}` : "";
  document.getElementById("prev").disabled = offset === 0;
  document.getElementById("next").disabled = last >= total;
}

async function load() {
  stop();
  const p = params();
  if (offset) p.set("offset", offset);
  history.replaceState(null, "", p.toString() ? "?" + p : location.pathname);
  p.set("limit", PAGE);
  const data = await (await fetch("/api/lines?" + p)).json();
  render(data);
}

function changed() {
  clearTimeout(timer);
  timer = setTimeout(() => { offset = 0; load(); }, 250);
}

async function start() {
  restore();
  facets = await (await fetch("/api/facets")).json();
  fill(form.kind, facets.kinds);
  fill(form.pack, facets.packs, (e) => `${e.label}${e.version ? " " + e.version : ""}`);
  fill(form.voice, facets.voices);
  fill(form.zone, facets.zones);
  const t = facets.totals;
  document.getElementById("status").innerHTML =
    `<b>${facets.packs_found}</b> packs · <b>${t.lines.toLocaleString()}</b> lines` +
    (facets.compare_label ? ` · <b>${t.with_compare.toLocaleString()}</b> with a take in ${esc(facets.compare_label)}` : "");
  const notices = [];
  if (!facets.packs_found) notices.push(`No voice packs found in <code>${esc(facets.addons || "(none)")}</code>. Set <code>WOW_DIR</code> to the folder holding <code>_classic_beta_</code>, or start with <code>--addons &lt;Interface/AddOns&gt;</code>.`);
  if (!facets.has_classic) notices.push(`Classic quests show no text until you run <code>uv run --no-group tts fvo-classicdb</code> (it writes <code>tools/data/bulk/classic.json</code>), then restart.`);
  document.getElementById("notices").innerHTML = notices.map((n) => `<div class="notice">${n}</div>`).join("");
  if (facets.compare_label) {
    document.getElementById("compare-box").hidden = false;
    document.getElementById("compare-label").textContent = `with a take in ${facets.compare_label}`;
    document.getElementById("cmp-head").textContent = facets.compare_label;
  }
  form.addEventListener("input", changed);
  form.addEventListener("change", changed);
  form.addEventListener("reset", () => setTimeout(changed));
  form.addEventListener("submit", (e) => { e.preventDefault(); changed(); });
  document.getElementById("prev").onclick = () => { offset = Math.max(0, offset - PAGE); load(); };
  document.getElementById("next").onclick = () => { offset += PAGE; load(); };
  load();
}
start();
</script>
</body>
</html>
